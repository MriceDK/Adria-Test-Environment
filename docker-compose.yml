services:
  database.adria:
    image: mysql:8.0
    container_name: database-adria-nutriscan
    restart: unless-stopped
    env_file:
      - .adria-database.test.env
    volumes:
      - nutriscan_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server.adria:
    image: hcr.technet.howest.be/adria-server-group-08:latest
    container_name: server-adria-nutriscan
    ports:
      - "8000:8000"
    env_file:
      - .adria-server.test.env
    depends_on:
      database.adria:
        condition: service_healthy
    restart: unless-stopped    
    
  client.adria:
    image: hcr.technet.howest.be/adria-client-group-08:latest
    container_name: client-adria-nutriscan
    ports:
      - "80:80"
    depends_on:
      - server.adria
    restart: unless-stopped


volumes:
  nutriscan_mysql:

networks:
  adria-test:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/16
